name: Probe image

# Builds an app image from an arbitrary ref and publishes it to this fork's
# GitHub Container Registry. Used to test a defect and its fix on a real
# deployment, because no published tag tracks main.
#
# The slow layers come from the pre-built pipeshubai/pipeshub-ai-base images,
# so a run takes minutes rather than hours.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag or sha)'
        required: true
        default: 'main'
      tag:
        description: 'Image tag to publish'
        required: true
        default: 'probe-main'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        # The runner ships with ~14 GB free; the app image plus its base layers
        # needs more than that.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # The target VM is amd64. Building one architecture halves the time.
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pipeshub-ai:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report
        run: |
          echo "published: ghcr.io/${{ github.repository_owner }}/pipeshub-ai:${{ inputs.tag }}"
          echo "built from ref: ${{ inputs.ref }} ($(git rev-parse --short HEAD))"
